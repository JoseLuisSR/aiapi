[project]
name = "aiapi"
version = "0.1.0"
description = "Python modelue to send request to AI LLM providers like OpenAI, Gemini, Claude."
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "anthropic>=0.103.1",
    "coverage>=7.14.1",
    "fastapi>=0.104.0",
    "google-genai>=2.4.0",
    "ipdb>=0.13.13",
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.24.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.15",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-bandit
    "S",
]
